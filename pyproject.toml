[project]
name = "tischlerei-report-worker"
version = "0.1.0"
description = "Woechentlicher Tischlerei-Berichts-Workflow (Mistral Workflows)"
requires-python = ">=3.11"
dependencies = [
    "mistralai-workflows>=3.10",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tischlerei"]
